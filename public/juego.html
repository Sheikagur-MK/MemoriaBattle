<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rebaño Mortal - Combate</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: #050510; overflow: hidden;
            font-family: 'Segoe UI', sans-serif; user-select: none; touch-action: none;
        }
        canvas { display: block; width: 100%; height: 100%; }
        
        /* Interfaz HUD */
        #hud {
            position: absolute; top: 20px; left: 20px;
            color: white; pointer-events: none; z-index: 10;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
        .hud-text { font-size: 20px; font-weight: bold; margin-bottom: 5px; }
        .highlight { color: #10b981; }
        
        #kill-feed {
            position: absolute; top: 20px; right: 20px;
            color: white; text-align: right; pointer-events: none;
            font-size: 14px; z-index: 10;
        }
        .feed-item { margin-bottom: 5px; opacity: 0.8; background: rgba(0,0,0,0.5); padding: 5px 10px; border-radius: 4px; }
        
        /* Pantalla de Muerte */
        #death-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 15, 25, 0.9); display: none;
            flex-direction: column; justify-content: center; align-items: center; z-index: 20;
        }
        #death-screen h1 { color: #ef4444; font-size: 48px; text-transform: uppercase; margin-bottom: 10px; }
        #death-screen p { color: white; font-size: 20px; }
        button {
            background: #3b82f6; color: white; border: none; padding: 15px 30px;
            font-size: 18px; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 20px;
        }
        button:hover { background: #2563eb; }
    </style>
</head>
<body>

    <div id="hud">
        <div class="hud-text">Sala: <span id="lbl-room" style="color: #60a5fa;">---</span></div>
        <div class="hud-text">Puntuación: <span id="lbl-score" class="highlight">0</span></div>
    </div>
    
    <div id="kill-feed"></div>

    <canvas id="gameCanvas"></canvas>

    <div id="death-screen">
        <h1>Núcleo Destruido</h1>
        <p id="death-msg">Fuiste eliminado.</p>
        <button onclick="window.location.href='index.html'">Volver al Lobby</button>
    </div>

    <script>
        // 1. VERIFICAR CREDENCIALES
        const tempUser = sessionStorage.getItem('tempUser');
        const tempPass = sessionStorage.getItem('tempPass');
        const gameMode = sessionStorage.getItem('gameMode') || 'casual';

        if (!tempUser || !tempPass) {
            window.location.href = 'index.html'; // Expulsar si no pasó por el lobby
        }

        // 2. CONFIGURACIÓN DEL MOTOR GRÁFICO
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize);
        resize();

        // 3. ESTADO DEL JUEGO
        const socket = io();
        let myId = null;
        let isDead = false;
        
        // Entidades
        const player = { x: width/2, y: height/2, radius: 15, pulling: false, mouseX: width/2, mouseY: height/2 };
        let enemies = {}; // Jugadores rivales
        let swarm = [];   // El rebaño de partículas
        const SWARM_COUNT = 300;
        const LETHAL_SPEED = 8;

        // Inicializar Enjambre
        for(let i = 0; i < SWARM_COUNT; i++) {
            swarm.push({
                x: Math.random() * 2000, y: Math.random() * 2000,
                vx: 0, vy: 0, radius: 4, owner: null
            });
        }

        // Cámara (Para seguir al jugador en un mapa más grande que la pantalla)
        let camera = { x: 0, y: 0 };

        // 4. CONEXIÓN Y RED
        socket.emit('login', { username: tempUser, password: tempPass });

        socket.on('auth_result', (data) => {
            if (data.ok) {
                myId = socket.id;
                socket.emit('join_match', { mode: gameMode });
            } else {
                window.location.href = 'index.html';
            }
        });

        socket.on('game_start', (data) => {
            document.getElementById('lbl-room').innerText = data.roomId;
            
            // Cargar estado inicial de enemigos
            for (let id in data.players) {
                if (id !== myId) {
                    enemies[id] = data.players[id];
                    // Variables para interpolación suave
                    enemies[id].targetX = enemies[id].x;
                    enemies[id].targetY = enemies[id].y;
                } else {
                    player.x = data.players[id].x;
                    player.y = data.players[id].y;
                }
            }
            requestAnimationFrame(gameLoop);
            setInterval(sendUpdate, 50); // Enviar datos al servidor 20 veces por segundo
        });

        socket.on('player_joined', (p) => {
            if (p.id !== myId) {
                p.targetX = p.x; p.targetY = p.y;
                enemies[p.id] = p;
            }
        });

        socket.on('player_left', (id) => { delete enemies[id]; });

        socket.on('player_moved', (data) => {
            if (enemies[data.id]) {
                enemies[data.id].targetX = data.x;
                enemies[data.id].targetY = data.y;
                enemies[data.id].pulling = data.pulling;
            }
        });

        // Simular explosión de un enemigo en nuestro cliente
        socket.on('enemy_blast', (data) => {
            applyKineticBlast(data.x, data.y, data.id);
        });

        socket.on('kill_feed', (data) => {
            const feed = document.getElementById('kill-feed');
            const item = document.createElement('div');
            item.className = 'feed-item';
            item.innerHTML = `<span style="color:#ef4444">${data.killer}</span> eliminó a <span style="color:#9ca3af">${data.victim}</span>`;
            feed.appendChild(item);
            setTimeout(() => item.remove(), 4000);

            if (data.victim === tempUser) {
                isDead = true;
                document.getElementById('death-screen').style.display = 'flex';
                document.getElementById('death-msg').innerText = `Asesinado por ${data.killer}`;
            }
            if (data.killer === tempUser) {
                document.getElementById('lbl-score').innerText = parseInt(document.getElementById('lbl-score').innerText) + 100;
            }
        });

        // 5. CONTROLES Y FÍSICAS
        function updateMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            let clientX = e.clientX || (e.touches && e.touches[0].clientX);
            let clientY = e.clientY || (e.touches && e.touches[0].clientY);
            if (clientX !== undefined) {
                // Convertir coordenadas de pantalla a coordenadas de mundo
                player.mouseX = clientX + camera.x;
                player.mouseY = clientY + camera.y;
            }
        }

        window.addEventListener('mousedown', (e) => { player.pulling = true; updateMousePos(e); });
        window.addEventListener('mousemove', updateMousePos);
        window.addEventListener('mouseup', () => { 
            if(player.pulling) triggerBlast(); 
            player.pulling = false; 
        });

        window.addEventListener('touchstart', (e) => { e.preventDefault(); player.pulling = true; updateMousePos(e); }, {passive: false});
        window.addEventListener('touchmove', (e) => { e.preventDefault(); updateMousePos(e); }, {passive: false});
        window.addEventListener('touchend', (e) => { 
            e.preventDefault(); 
            if(player.pulling) triggerBlast(); 
            player.pulling = false; 
        }, {passive: false});

        function sendUpdate() {
            if (isDead) return;
            socket.emit('player_update', { x: player.x, y: player.y, pulling: player.pulling });
        }

        function triggerBlast() {
            if (isDead) return;
            applyKineticBlast(player.x, player.y, myId);
            socket.emit('kinetic_blast', { x: player.x, y: player.y });
        }

        function applyKineticBlast(originX, originY, ownerId) {
            swarm.forEach(s => {
                const dx = s.x - originX;
                const dy = s.y - originY;
                const dist = Math.hypot(dx, dy);
                if (dist < 200) {
                    const force = (200 - dist) / 150;
                    s.vx += (dx / dist) * force * 25; // Impulso letal
                    s.vy += (dy / dist) * force * 25;
                    s.owner = ownerId; // Esta partícula ahora pertenece a quien la disparó
                }
            });
        }

        // 6. MOTOR DE RENDERIZADO (GAME LOOP)
        function gameLoop() {
            if (isDead) return;

            // Movimiento del jugador hacia el ratón
            const dx = player.mouseX - player.x;
            const dy = player.mouseY - player.y;
            if (Math.hypot(dx, dy) > 5) {
                player.x += dx * 0.05;
                player.y += dy * 0.05;
            }

            // Actualizar Cámara (Centrada en el jugador)
            camera.x = player.x - width / 2;
            camera.y = player.y - height / 2;

            // Limpiar Pantalla
            ctx.fillStyle = '#050510';
            ctx.fillRect(0, 0, width, height);

            ctx.save();
            ctx.translate(-camera.x, -camera.y); // Aplicar cámara

            // Dibujar Cuadrícula de Fondo (Mundo)
            ctx.strokeStyle = '#111827';
            ctx.lineWidth = 1;
            for(let i = -1000; i < 3000; i+= 100) {
                ctx.beginPath(); ctx.moveTo(i, -1000); ctx.lineTo(i, 3000); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(-1000, i); ctx.lineTo(3000, i); ctx.stroke();
            }

            // --- LÓGICA DEL ENJAMBRE ---
            swarm.forEach(s => {
                s.vx *= 0.96; // Fricción
                s.vy *= 0.96;
                const speed = Math.hypot(s.vx, s.vy);
                
                // Si va lento, pierde dueño y vuelve a ser neutral
                if (speed < 2) s.owner = null;

                // Atracción hacia jugadores que estén usando el imán
                let attracted = false;
                
                // Evaluar mi imán
                if (player.pulling) {
                    const pDx = player.x - s.x; const pDy = player.y - s.y;
                    const pDist = Math.hypot(pDx, pDy);
                    if (pDist > 30 && pDist < 400) {
                        s.vx += (pDx / pDist) * 1.2;
                        s.vy += (pDy / pDist) * 1.2;
                        attracted = true;
                    }
                }
                
                // Evaluar imán de enemigos
                for (let id in enemies) {
                    let e = enemies[id];
                    if (e.pulling) {
                        const eDx = e.x - s.x; const eDy = e.y - s.y;
                        const eDist = Math.hypot(eDx, eDy);
                        if (eDist > 30 && eDist < 400) {
                            s.vx += (eDx / eDist) * 1.2;
                            s.vy += (eDy / eDist) * 1.2;
                        }
                    }
                }

                // Movimiento errático si nadie atrae y son neutrales
                if (!attracted && !s.owner && speed < 1) {
                    s.vx += (Math.random() - 0.5) * 0.2;
                    s.vy += (Math.random() - 0.5) * 0.2;
                }

                s.x += s.vx; s.y += s.vy;

                // Colisiones letales (Yo matando a otros)
                if (speed > LETHAL_SPEED && s.owner === myId) {
                    for (let id in enemies) {
                        let e = enemies[id];
                        if (Math.hypot(s.x - e.x, s.y - e.y) < player.radius) {
                            // ¡Impacto confirmado!
                            socket.emit('player_killed', { victimId: id });
                            s.vx *= 0.1; s.vy *= 0.1; // Partícula muere tras el impacto
                        }
                    }
                }

                // Renderizar Partícula
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
                if (speed > LETHAL_SPEED) {
                    ctx.fillStyle = s.owner === myId ? '#10b981' : '#ef4444'; // Verde si es mío, Rojo si es letal enemigo
                    ctx.shadowColor = ctx.fillStyle;
                    ctx.shadowBlur = 10;
                } else {
                    ctx.fillStyle = '#3b82f6'; // Neutral Azul
                    ctx.shadowBlur = 0;
                }
                ctx.fill();
            });
            ctx.shadowBlur = 0;

            // --- DIBUJAR ENEMIGOS ---
            for (let id in enemies) {
                let e = enemies[id];
                // Interpolación suave
                e.x += (e.targetX - e.x) * 0.2;
                e.y += (e.targetY - e.y) * 0.2;

                ctx.beginPath();
                ctx.arc(e.x, e.y, player.radius, 0, Math.PI*2);
                ctx.fillStyle = '#ef4444'; // Enemigos siempre rojos
                ctx.fill();
                
                if (e.pulling) {
                    ctx.beginPath(); ctx.arc(e.x, e.y, 150, 0, Math.PI*2);
                    ctx.strokeStyle = 'rgba(239, 68, 68, 0.2)'; ctx.lineWidth = 2; ctx.stroke();
                }
                
                // Nombre
                ctx.fillStyle = '#9ca3af'; ctx.font = '12px sans-serif'; ctx.textAlign = 'center';
                ctx.fillText(e.username, e.x, e.y - 25);
            }

            // --- DIBUJAR JUGADOR LOCAL ---
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI*2);
            ctx.fillStyle = '#10b981'; // Nosotros siempre verdes
            ctx.fill();

            if (player.pulling) {
                ctx.beginPath(); ctx.arc(player.x, player.y, 150, 0, Math.PI*2);
                ctx.strokeStyle = 'rgba(16, 185, 129, 0.2)'; ctx.lineWidth = 2; ctx.stroke();
            }

            ctx.restore();
            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
