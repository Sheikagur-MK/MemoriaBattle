<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rebaño Mortal - Combate</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: #030308; overflow: hidden;
            font-family: 'Segoe UI', sans-serif; user-select: none; touch-action: none;
        }
        canvas { display: block; width: 100%; height: 100%; }
        
        #hud { position: absolute; top: 20px; left: 20px; color: white; pointer-events: none; z-index: 10; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
        .hud-text { font-size: 20px; font-weight: bold; margin-bottom: 5px; }
        .highlight { color: #10b981; }
        
        #kill-feed { position: absolute; top: 20px; right: 20px; color: white; text-align: right; pointer-events: none; font-size: 14px; z-index: 10; }
        .feed-item { margin-bottom: 5px; opacity: 0.8; background: rgba(0,0,0,0.5); padding: 5px 10px; border-radius: 4px; border-left: 2px solid #ef4444; }
        
        #death-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 15, 25, 0.9); display: none;
            flex-direction: column; justify-content: center; align-items: center; z-index: 20; backdrop-filter: blur(5px);
        }
        #death-screen h1 { color: #ef4444; font-size: 48px; text-transform: uppercase; margin-bottom: 10px; text-shadow: 0 0 20px #ef4444; }
        #death-screen p { color: white; font-size: 20px; }
        button { background: #3b82f6; color: white; border: none; padding: 15px 30px; font-size: 18px; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 20px; text-transform: uppercase; }
        button:hover { background: #2563eb; }
    </style>
</head>
<body>

    <div id="hud">
        <div class="hud-text">Sector: <span id="lbl-room" style="color: #60a5fa;">---</span></div>
        <div class="hud-text">Destrucciones: <span id="lbl-score" class="highlight">0</span></div>
    </div>
    <div id="kill-feed"></div>
    <canvas id="gameCanvas"></canvas>

    <div id="death-screen">
        <h1>Núcleo Destruido</h1>
        <p id="death-msg">Tu energía cinética fue neutralizada.</p>
        <button onclick="window.location.href='index.html'">Desconexión (Volver al Lobby)</button>
    </div>

    <script>
        const tempUser = sessionStorage.getItem('tempUser');
        const tempPass = sessionStorage.getItem('tempPass');
        const gameMode = sessionStorage.getItem('gameMode') || 'casual';

        if (!tempUser || !tempPass) window.location.href = 'index.html';

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize);
        resize();

        const socket = io();
        let myId = null;
        let isDead = false;
        
        // Parámetros del Mundo y Cámara
        const MAP_SIZE = 3000;
        const ZOOM = 0.55; // Nivel de alejamiento (Menos zoom = ves más mapa)
        
        const player = { x: MAP_SIZE/2, y: MAP_SIZE/2, radius: 20, pulling: false, mouseX: MAP_SIZE/2, mouseY: MAP_SIZE/2 };
        let enemies = {}; 
        let swarm = [];   
        const SWARM_COUNT = 400;
        const LETHAL_SPEED = 8;

        for(let i = 0; i < SWARM_COUNT; i++) {
            swarm.push({
                x: Math.random() * MAP_SIZE, y: Math.random() * MAP_SIZE,
                vx: 0, vy: 0, radius: 5, owner: null
            });
        }

        socket.emit('login', { username: tempUser, password: tempPass });

        socket.on('auth_result', (data) => {
            if (data.ok) {
                myId = socket.id;
                socket.emit('join_match', { mode: gameMode });
            } else {
                window.location.href = 'index.html';
            }
        });

        socket.on('game_start', (data) => {
            document.getElementById('lbl-room').innerText = data.roomId;
            for (let id in data.players) {
                if (id !== myId) {
                    enemies[id] = data.players[id];
                    enemies[id].targetX = enemies[id].x;
                    enemies[id].targetY = enemies[id].y;
                } else {
                    player.x = data.players[id].x;
                    player.y = data.players[id].y;
                }
            }
            requestAnimationFrame(gameLoop);
            setInterval(sendUpdate, 50);
        });

        socket.on('player_joined', (p) => {
            if (p.id !== myId) { p.targetX = p.x; p.targetY = p.y; enemies[p.id] = p; }
        });
        socket.on('player_left', (id) => { delete enemies[id]; });
        socket.on('player_moved', (data) => {
            if (enemies[data.id]) {
                enemies[data.id].targetX = data.x; enemies[data.id].targetY = data.y; enemies[data.id].pulling = data.pulling;
            }
        });
        socket.on('enemy_blast', (data) => { applyKineticBlast(data.x, data.y, data.id); });

        socket.on('kill_feed', (data) => {
            const feed = document.getElementById('kill-feed');
            const item = document.createElement('div');
            item.className = 'feed-item';
            item.innerHTML = `<span style="color:#ef4444">${data.killer}</span> eliminó a <span style="color:#9ca3af">${data.victim}</span>`;
            feed.appendChild(item);
            setTimeout(() => item.remove(), 4000);

            if (data.victim === tempUser) {
                isDead = true;
                document.getElementById('death-screen').style.display = 'flex';
                document.getElementById('death-msg').innerText = `Destruido por ${data.killer}`;
            }
            if (data.killer === tempUser) {
                document.getElementById('lbl-score').innerText = parseInt(document.getElementById('lbl-score').innerText) + 1;
            }
        });

        function updateMousePos(e) {
            let clientX = e.clientX || (e.touches && e.touches[0].clientX);
            let clientY = e.clientY || (e.touches && e.touches[0].clientY);
            if (clientX !== undefined) {
                // Matemáticas para traducir la posición del ratón considerando el Zoom de la cámara
                player.mouseX = (clientX - width / 2) / ZOOM + player.x;
                player.mouseY = (clientY - height / 2) / ZOOM + player.y;
            }
        }

        window.addEventListener('mousedown', (e) => { player.pulling = true; updateMousePos(e); });
        window.addEventListener('mousemove', updateMousePos);
        window.addEventListener('mouseup', () => { if(player.pulling) triggerBlast(); player.pulling = false; });
        window.addEventListener('touchstart', (e) => { e.preventDefault(); player.pulling = true; updateMousePos(e); }, {passive: false});
        window.addEventListener('touchmove', (e) => { e.preventDefault(); updateMousePos(e); }, {passive: false});
        window.addEventListener('touchend', (e) => { e.preventDefault(); if(player.pulling) triggerBlast(); player.pulling = false; }, {passive: false});

        function sendUpdate() {
            if (isDead) return;
            socket.emit('player_update', { x: player.x, y: player.y, pulling: player.pulling });
        }

        function triggerBlast() {
            if (isDead) return;
            applyKineticBlast(player.x, player.y, myId);
            socket.emit('kinetic_blast', { x: player.x, y: player.y });
        }

        function applyKineticBlast(originX, originY, ownerId) {
            swarm.forEach(s => {
                const dx = s.x - originX;
                const dy = s.y - originY;
                const dist = Math.hypot(dx, dy);
                if (dist < 250) {
                    const force = (250 - dist) / 200;
                    s.vx += (dx / dist) * force * 30; 
                    s.vy += (dy / dist) * force * 30;
                    s.owner = ownerId; 
                }
            });
        }

        // DIBUJAR MINIMAPA UI
        function drawMinimap() {
            const mmSize = 180;
            const padding = 20;
            const mmX = width - mmSize - padding;
            const mmY = height - mmSize - padding;

            // Fondo Minimapa
            ctx.fillStyle = 'rgba(5, 10, 20, 0.7)';
            ctx.fillRect(mmX, mmY, mmSize, mmSize);
            ctx.strokeStyle = '#3b82f6';
            ctx.lineWidth = 2;
            ctx.strokeRect(mmX, mmY, mmSize, mmSize);

            // Dibujar Jugador en Minimapa
            const px = (player.x / MAP_SIZE) * mmSize;
            const py = (player.y / MAP_SIZE) * mmSize;
            ctx.fillStyle = '#10b981';
            ctx.beginPath();
            ctx.arc(mmX + px, mmY + py, 4, 0, Math.PI * 2);
            ctx.fill();
            
            // Dibujar Enemigos
            ctx.fillStyle = '#ef4444';
            for (let id in enemies) {
                let e = enemies[id];
                const ex = (e.x / MAP_SIZE) * mmSize;
                const ey = (e.y / MAP_SIZE) * mmSize;
                ctx.beginPath();
                ctx.arc(mmX + ex, mmY + ey, 3, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function gameLoop() {
            if (isDead) return;

            // Movimiento
            const dx = player.mouseX - player.x;
            const dy = player.mouseY - player.y;
            if (Math.hypot(dx, dy) > 10) {
                player.x += dx * 0.06;
                player.y += dy * 0.06;
            }

            // Limitar al borde del mapa
            if (player.x < 0) player.x = 0; if (player.x > MAP_SIZE) player.x = MAP_SIZE;
            if (player.y < 0) player.y = 0; if (player.y > MAP_SIZE) player.y = MAP_SIZE;

            // Limpiar Pantalla
            ctx.fillStyle = '#030308';
            ctx.fillRect(0, 0, width, height);

            ctx.save();
            
            // APLICAR CÁMARA CON ZOOM
            ctx.translate(width / 2, height / 2); // Centrar
            ctx.scale(ZOOM, ZOOM);                // Alejar la vista
            ctx.translate(-player.x, -player.y);  // Mover al jugador

            // Suelo Cibernético (Líneas de la cuadrícula)
            ctx.strokeStyle = '#0f172a';
            ctx.lineWidth = 2;
            const gridSize = 150;
            ctx.beginPath();
            for(let i = 0; i <= MAP_SIZE; i += gridSize) {
                ctx.moveTo(i, 0); ctx.lineTo(i, MAP_SIZE); // Verticales
                ctx.moveTo(0, i); ctx.lineTo(MAP_SIZE, i); // Horizontales
            }
            ctx.stroke();
            
            // Borde del mapa letal
            ctx.strokeStyle = '#ef4444';
            ctx.lineWidth = 10;
            ctx.strokeRect(0, 0, MAP_SIZE, MAP_SIZE);

            // --- LÓGICA DEL ENJAMBRE ---
            swarm.forEach(s => {
                s.vx *= 0.96; s.vy *= 0.96;
                const speed = Math.hypot(s.vx, s.vy);
                if (speed < 2) s.owner = null;

                let attracted = false;
                
                if (player.pulling) {
                    const pDx = player.x - s.x; const pDy = player.y - s.y;
                    const pDist = Math.hypot(pDx, pDy);
                    if (pDist > 40 && pDist < 500) {
                        s.vx += (pDx / pDist) * 1.5; s.vy += (pDy / pDist) * 1.5; attracted = true;
                    }
                }
                
                for (let id in enemies) {
                    let e = enemies[id];
                    if (e.pulling) {
                        const eDx = e.x - s.x; const eDy = e.y - s.y;
                        const eDist = Math.hypot(eDx, eDy);
                        if (eDist > 40 && eDist < 500) {
                            s.vx += (eDx / eDist) * 1.5; s.vy += (eDy / eDist) * 1.5;
                        }
                    }
                }

                if (!attracted && !s.owner && speed < 1) {
                    s.vx += (Math.random() - 0.5) * 0.3; s.vy += (Math.random() - 0.5) * 0.3;
                }

                s.x += s.vx; s.y += s.vy;
                
                // Rebote en los bordes del mapa
                if(s.x < 0 || s.x > MAP_SIZE) s.vx *= -1;
                if(s.y < 0 || s.y > MAP_SIZE) s.vy *= -1;

                if (speed > LETHAL_SPEED && s.owner === myId) {
                    for (let id in enemies) {
                        let e = enemies[id];
                        if (Math.hypot(s.x - e.x, s.y - e.y) < player.radius) {
                            socket.emit('player_killed', { victimId: id });
                            s.vx *= 0.1; s.vy *= 0.1; 
                        }
                    }
                }

                ctx.beginPath();
                ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
                if (speed > LETHAL_SPEED) {
                    ctx.fillStyle = s.owner === myId ? '#10b981' : '#ef4444'; 
                    ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 15;
                } else {
                    ctx.fillStyle = '#3b82f6'; ctx.shadowBlur = 0;
                }
                ctx.fill();
            });
            ctx.shadowBlur = 0;

            // --- ENEMIGOS ---
            for (let id in enemies) {
                let e = enemies[id];
                e.x += (e.targetX - e.x) * 0.2; e.y += (e.targetY - e.y) * 0.2;

                ctx.beginPath(); ctx.arc(e.x, e.y, player.radius, 0, Math.PI*2);
                ctx.fillStyle = '#ef4444'; ctx.fill();
                
                if (e.pulling) {
                    ctx.beginPath(); ctx.arc(e.x, e.y, 250, 0, Math.PI*2);
                    ctx.strokeStyle = 'rgba(239, 68, 68, 0.2)'; ctx.lineWidth = 3; ctx.stroke();
                }
                ctx.fillStyle = '#9ca3af'; ctx.font = 'bold 20px sans-serif'; ctx.textAlign = 'center';
                ctx.fillText(e.username, e.x, e.y - 35);
            }

            // --- JUGADOR ---
            ctx.beginPath(); ctx.arc(player.x, player.y, player.radius, 0, Math.PI*2);
            ctx.fillStyle = '#10b981'; ctx.shadowColor = '#10b981'; ctx.shadowBlur = 20; ctx.fill(); ctx.shadowBlur = 0;

            if (player.pulling) {
                // Radio magnético más grande visible
                ctx.beginPath(); ctx.arc(player.x, player.y, 250, 0, Math.PI*2);
                ctx.strokeStyle = 'rgba(16, 185, 129, 0.2)'; ctx.lineWidth = 3; ctx.stroke();
            }

            ctx.restore(); // Quitamos la cámara para dibujar la Interfaz (UI) encima de todo

            // DIBUJAR MINIMAPA FUERA DEL ZOOM
            drawMinimap();

            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
