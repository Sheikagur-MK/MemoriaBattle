<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rebaño Mortal - Combate Orbital</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: #020205; overflow: hidden;
            font-family: 'Segoe UI', sans-serif; user-select: none; touch-action: none;
        }
        canvas { display: block; width: 100%; height: 100%; }
        
        #hud { position: absolute; top: 20px; left: 20px; color: white; pointer-events: none; z-index: 10; text-shadow: 0 2px 10px rgba(0,0,0,1); }
        .hud-text { font-size: 18px; font-weight: bold; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; color: #94a3b8; }
        .highlight { color: #0ea5e9; font-size: 24px; }
        
        #kill-feed { position: absolute; top: 20px; right: 20px; color: white; text-align: right; pointer-events: none; font-size: 14px; z-index: 10; }
        .feed-item { margin-bottom: 5px; background: rgba(15, 23, 42, 0.7); padding: 8px 12px; border-radius: 4px; border-right: 3px solid #f43f5e; box-shadow: 0 0 10px rgba(0,0,0,0.5); }
        
        #death-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(2, 2, 5, 0.85); display: none;
            flex-direction: column; justify-content: center; align-items: center; z-index: 20; backdrop-filter: blur(10px);
        }
        #death-screen h1 { color: #f43f5e; font-size: 3rem; text-transform: uppercase; margin-bottom: 10px; text-shadow: 0 0 30px #f43f5e; letter-spacing: 5px; }
        #death-screen p { color: #94a3b8; font-size: 1.2rem; }
        button { background: #0ea5e9; color: white; border: none; padding: 15px 30px; font-size: 1.1rem; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 30px; text-transform: uppercase; letter-spacing: 2px; }
        button:hover { background: #0284c7; box-shadow: 0 0 20px rgba(14,165,233,0.5); }
    </style>
</head>
<body>

    <div id="hud">
        <div class="hud-text">Sector: <span id="lbl-room" style="color: #f8fafc;">---</span></div>
        <div class="hud-text">Naves Destruidas: <span id="lbl-score" class="highlight">0</span></div>
    </div>
    <div id="kill-feed"></div>
    <canvas id="gameCanvas"></canvas>

    <div id="death-screen">
        <h1>Nave Destruida</h1>
        <p id="death-msg">Blindaje perforado por energía cinética.</p>
        <button onclick="window.location.href='index.html'">Volver al Hangar</button>
    </div>

    <script>
        const tempUser = sessionStorage.getItem('tempUser');
        const tempPass = sessionStorage.getItem('tempPass');
        const gameMode = sessionStorage.getItem('gameMode') || 'casual';

        if (!tempUser || !tempPass) window.location.href = 'index.html';

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize);
        resize();

        const socket = io();
        let myId = null;
        let isDead = false;
        
        // Parámetros Épicos
        const MAP_SIZE = 6000; // MAPA GIGANTE EL DOBLE DEL ANTERIOR
        const ZOOM = 0.55; 
        
        const player = { x: MAP_SIZE/2, y: MAP_SIZE/2, radius: 25, pulling: false, mouseX: MAP_SIZE/2, mouseY: MAP_SIZE/2, angle: 0 };
        let enemies = {}; 
        let swarm = [];   
        const SWARM_COUNT = 800; // Más partículas para llenar el nuevo mapa
        const LETHAL_SPEED = 10; // Un poco más de velocidad requerida

        for(let i = 0; i < SWARM_COUNT; i++) {
            swarm.push({
                x: Math.random() * MAP_SIZE, y: Math.random() * MAP_SIZE,
                vx: 0, vy: 0, radius: 4, owner: null
            });
        }

        socket.emit('login', { username: tempUser, password: tempPass });

        socket.on('auth_result', (data) => {
            if (data.ok) { myId = socket.id; socket.emit('join_match', { mode: gameMode }); } 
            else { window.location.href = 'index.html'; }
        });

        socket.on('game_start', (data) => {
            document.getElementById('lbl-room').innerText = data.roomId;
            for (let id in data.players) {
                if (id !== myId) {
                    enemies[id] = data.players[id];
                    enemies[id].targetX = enemies[id].x; enemies[id].targetY = enemies[id].y; enemies[id].angle = 0;
                } else {
                    player.x = data.players[id].x; player.y = data.players[id].y;
                }
            }
            requestAnimationFrame(gameLoop);
            setInterval(sendUpdate, 50);
        });

        socket.on('player_joined', (p) => {
            if (p.id !== myId) { p.targetX = p.x; p.targetY = p.y; p.angle = 0; enemies[p.id] = p; }
        });
        socket.on('player_left', (id) => { delete enemies[id]; });
        socket.on('player_moved', (data) => {
            if (enemies[data.id]) {
                enemies[data.id].targetX = data.x; enemies[data.id].targetY = data.y; enemies[data.id].pulling = data.pulling;
            }
        });
        socket.on('enemy_blast', (data) => { applyKineticBlast(data.x, data.y, data.id); });

        socket.on('kill_feed', (data) => {
            const feed = document.getElementById('kill-feed');
            const item = document.createElement('div');
            item.className = 'feed-item';
            item.innerHTML = `<span style="color:#f43f5e">${data.killer}</span> eliminó a <span style="color:#94a3b8">${data.victim}</span>`;
            feed.appendChild(item);
            setTimeout(() => item.remove(), 4000);

            if (data.victim === tempUser) {
                isDead = true;
                document.getElementById('death-screen').style.display = 'flex';
                document.getElementById('death-msg').innerText = `Destruido por ${data.killer}`;
            }
            if (data.killer === tempUser) {
                document.getElementById('lbl-score').innerText = parseInt(document.getElementById('lbl-score').innerText) + 1;
            }
        });

        function updateMousePos(e) {
            let clientX = e.clientX || (e.touches && e.touches[0].clientX);
            let clientY = e.clientY || (e.touches && e.touches[0].clientY);
            if (clientX !== undefined) {
                player.mouseX = (clientX - width / 2) / ZOOM + player.x;
                player.mouseY = (clientY - height / 2) / ZOOM + player.y;
            }
        }

        window.addEventListener('mousedown', (e) => { player.pulling = true; updateMousePos(e); });
        window.addEventListener('mousemove', updateMousePos);
        window.addEventListener('mouseup', () => { if(player.pulling) triggerBlast(); player.pulling = false; });
        window.addEventListener('touchstart', (e) => { e.preventDefault(); player.pulling = true; updateMousePos(e); }, {passive: false});
        window.addEventListener('touchmove', (e) => { e.preventDefault(); updateMousePos(e); }, {passive: false});
        window.addEventListener('touchend', (e) => { e.preventDefault(); if(player.pulling) triggerBlast(); player.pulling = false; }, {passive: false});

        function sendUpdate() {
            if (isDead) return;
            socket.emit('player_update', { x: player.x, y: player.y, pulling: player.pulling });
        }

        function triggerBlast() {
            if (isDead) return;
            applyKineticBlast(player.x, player.y, myId);
            socket.emit('kinetic_blast', { x: player.x, y: player.y });
        }

        function applyKineticBlast(originX, originY, ownerId) {
            swarm.forEach(s => {
                const dx = s.x - originX; const dy = s.y - originY;
                const dist = Math.hypot(dx, dy);
                if (dist < 300) {
                    const force = (300 - dist) / 200;
                    s.vx += (dx / dist) * force * 35; 
                    s.vy += (dy / dist) * force * 35;
                    s.owner = ownerId; 
                }
            });
        }

        function drawShip(x, y, radius, color, angle, isPulling, name) {
            ctx.save();
            ctx.translate(x, y);
            
            // Etiqueta del nombre (arriba, no gira con la nave)
            ctx.fillStyle = '#94a3b8'; ctx.font = 'bold 24px sans-serif'; ctx.textAlign = 'center';
            ctx.fillText(name, 0, -radius - 20);

            // Rotar universo local para dibujar la nave
            ctx.rotate(angle);

            // Propulsor (Fuego de motor)
            ctx.beginPath();
            ctx.moveTo(-radius + 5, -radius/2 + 5);
            ctx.lineTo(-radius - (Math.random()*15 + 10), 0);
            ctx.lineTo(-radius + 5, radius/2 - 5);
            ctx.fillStyle = '#fbbf24'; ctx.fill();

            // Cuerpo de la nave (Diseño Delta)
            ctx.beginPath();
            ctx.moveTo(radius * 1.2, 0); // Nariz puntiaguda
            ctx.lineTo(-radius, radius * 0.8); // Ala Izquierda
            ctx.lineTo(-radius * 0.4, 0); // Centro Trasero
            ctx.lineTo(-radius, -radius * 0.8); // Ala Derecha
            ctx.closePath();
            
            ctx.fillStyle = color;
            ctx.shadowColor = color;
            ctx.shadowBlur = 20;
            ctx.fill();

            // Cabina (Cockpit)
            ctx.beginPath();
            ctx.moveTo(radius * 0.4, 0);
            ctx.lineTo(-radius * 0.1, radius * 0.2);
            ctx.lineTo(-radius * 0.1, -radius * 0.2);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.shadowBlur = 0;
            ctx.fill();

            // Escudo Magnético
            if (isPulling) {
                ctx.beginPath(); ctx.arc(0, 0, 300, 0, Math.PI*2);
                ctx.strokeStyle = color; ctx.lineWidth = 4;
                ctx.globalAlpha = 0.3; ctx.stroke(); ctx.globalAlpha = 1.0;
            }
            ctx.restore();
        }

        function drawMinimap() {
            const mmSize = 200;
            const padding = 20;
            const mmX = width - mmSize - padding;
            const mmY = height - mmSize - padding;

            ctx.fillStyle = 'rgba(2, 2, 5, 0.8)';
            ctx.fillRect(mmX, mmY, mmSize, mmSize);
            ctx.strokeStyle = '#0ea5e9'; ctx.lineWidth = 2; ctx.strokeRect(mmX, mmY, mmSize, mmSize);

            const px = (player.x / MAP_SIZE) * mmSize; const py = (player.y / MAP_SIZE) * mmSize;
            ctx.fillStyle = '#10b981'; ctx.beginPath(); ctx.arc(mmX + px, mmY + py, 5, 0, Math.PI * 2); ctx.fill();
            
            ctx.fillStyle = '#f43f5e';
            for (let id in enemies) {
                const ex = (enemies[id].x / MAP_SIZE) * mmSize; const ey = (enemies[id].y / MAP_SIZE) * mmSize;
                ctx.beginPath(); ctx.arc(mmX + ex, mmY + ey, 4, 0, Math.PI * 2); ctx.fill();
            }
        }

        function gameLoop() {
            if (isDead) return;

            // Físicas y Movimiento del Jugador
            const dx = player.mouseX - player.x;
            const dy = player.mouseY - player.y;
            const distToMouse = Math.hypot(dx, dy);
            
            // Actualizar ángulo de la nave hacia el ratón
            player.angle = Math.atan2(dy, dx);

            if (distToMouse > 15) {
                player.x += (dx / distToMouse) * 8; // Velocidad de nave
                player.y += (dy / distToMouse) * 8;
            }

            if (player.x < 0) player.x = 0; if (player.x > MAP_SIZE) player.x = MAP_SIZE;
            if (player.y < 0) player.y = 0; if (player.y > MAP_SIZE) player.y = MAP_SIZE;

            // Render
            ctx.fillStyle = '#020205'; ctx.fillRect(0, 0, width, height);
            ctx.save();
            ctx.translate(width / 2, height / 2);
            ctx.scale(ZOOM, ZOOM);
            ctx.translate(-player.x, -player.y);

            // Cuadrícula Espacial
            ctx.strokeStyle = 'rgba(14, 165, 233, 0.1)';
            ctx.lineWidth = 2;
            const gridSize = 200;
            ctx.beginPath();
            for(let i = 0; i <= MAP_SIZE; i += gridSize) {
                ctx.moveTo(i, 0); ctx.lineTo(i, MAP_SIZE);
                ctx.moveTo(0, i); ctx.lineTo(MAP_SIZE, i);
            }
            ctx.stroke();
            
            // Muro Letal
            ctx.strokeStyle = 'rgba(244, 63, 94, 0.8)'; ctx.lineWidth = 15; ctx.strokeRect(0, 0, MAP_SIZE, MAP_SIZE);

            // --- PARTÍCULAS DE ENERGÍA ---
            swarm.forEach(s => {
                s.vx *= 0.97; s.vy *= 0.97; // Fricción espacial
                const speed = Math.hypot(s.vx, s.vy);
                if (speed < 2) s.owner = null;

                let attracted = false;
                
                if (player.pulling) {
                    const pDx = player.x - s.x; const pDy = player.y - s.y; const pDist = Math.hypot(pDx, pDy);
                    if (pDist > 50 && pDist < 600) { s.vx += (pDx / pDist) * 1.8; s.vy += (pDy / pDist) * 1.8; attracted = true; }
                }
                
                for (let id in enemies) {
                    let e = enemies[id];
                    if (e.pulling) {
                        const eDx = e.x - s.x; const eDy = e.y - s.y; const eDist = Math.hypot(eDx, eDy);
                        if (eDist > 50 && eDist < 600) { s.vx += (eDx / eDist) * 1.8; s.vy += (eDy / eDist) * 1.8; }
                    }
                }

                if (!attracted && !s.owner && speed < 1) {
                    s.vx += (Math.random() - 0.5) * 0.4; s.vy += (Math.random() - 0.5) * 0.4;
                }

                s.x += s.vx; s.y += s.vy;
                
                if(s.x < 0 || s.x > MAP_SIZE) s.vx *= -1;
                if(s.y < 0 || s.y > MAP_SIZE) s.vy *= -1;

                if (speed > LETHAL_SPEED && s.owner === myId) {
                    for (let id in enemies) {
                        let e = enemies[id];
                        if (Math.hypot(s.x - e.x, s.y - e.y) < 35) { // Hitbox de la nave
                            socket.emit('player_killed', { victimId: id });
                            s.vx *= 0.1; s.vy *= 0.1; 
                        }
                    }
                }

                // DIBUJO DE LA PARTÍCULA (Efecto Láser vs Orbe)
                ctx.save();
                ctx.translate(s.x, s.y);
                const particleAngle = Math.atan2(s.vy, s.vx);
                ctx.rotate(particleAngle);

                ctx.beginPath();
                if (speed > LETHAL_SPEED) {
                    // Rayo Láser letal
                    const length = speed * 2;
                    ctx.moveTo(-length, 0); ctx.lineTo(length, 0);
                    ctx.strokeStyle = s.owner === myId ? '#10b981' : '#f43f5e';
                    ctx.lineWidth = 6;
                    ctx.shadowColor = ctx.strokeStyle; ctx.shadowBlur = 15;
                    ctx.stroke();
                } else {
                    // Orbe de energía pulsante neutral
                    ctx.arc(0, 0, s.radius + (Math.random()*2), 0, Math.PI * 2);
                    ctx.fillStyle = '#0ea5e9'; // Azul neón
                    ctx.shadowColor = '#0ea5e9'; ctx.shadowBlur = 10;
                    ctx.fill();
                }
                ctx.restore();
            });

            // --- ENEMIGOS (Naves Rojas) ---
            for (let id in enemies) {
                let e = enemies[id];
                const eDist = Math.hypot(e.targetX - e.x, e.targetY - e.y);
                if (eDist > 2) e.angle = Math.atan2(e.targetY - e.y, e.targetX - e.x); // Calcula a dónde vuela
                
                e.x += (e.targetX - e.x) * 0.2; e.y += (e.targetY - e.y) * 0.2;
                drawShip(e.x, e.y, 25, '#f43f5e', e.angle, e.pulling, e.username);
            }

            // --- JUGADOR (Nave Verde) ---
            drawShip(player.x, player.y, player.radius, '#10b981', player.angle, player.pulling, tempUser);

            ctx.restore();
            drawMinimap();
            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
